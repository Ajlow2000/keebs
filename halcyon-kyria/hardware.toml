[keyboard]
name = "Halcyon Kyria"
product_name = "Halcyon Kyria"
vendor_id = 0x4c4b
product_id = 0x0002
manufacturer = "splitkb"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 4
cols = 7
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_28", rx_pin = "PIN_29" }]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["PIN_8", "PIN_11", "PIN_7", "PIN_6"]
col_pins = ["PIN_5", "PIN_10", "PIN_9", "PIN_4", "PIN_25", "PIN_20", "PIN_19"]
bootmagic = [0, 0]

[[split.central.input_device.encoder]]
pin_a = "PIN_23"
pin_b = "PIN_22"
phase = "resolution"
resolution = 2
reverse = true
internal_pullup = true

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 7
serial = [{ instance = "UART0", tx_pin = "PIN_28", rx_pin = "PIN_29" }]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["PIN_8", "PIN_11", "PIN_7", "PIN_6"]
col_pins = ["PIN_5", "PIN_10", "PIN_9", "PIN_4", "PIN_25", "PIN_20", "PIN_19"]
bootmagic = [0, 0]

[[split.peripheral.input_device.encoder]]
pin_a = "PIN_23"
pin_b = "PIN_22"
phase = "resolution"
resolution = 2
reverse = false
internal_pullup = true

[host]
vial_enabled = false

[storage]
enabled = false
