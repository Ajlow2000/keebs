# Hardware configuration for Halcyon Kyria with Halcyon (RP2040) controllers.
# This file is merged with ../keymap/keyboard_layout.toml by build.rs
# to produce keyboard.toml, which is then read by the #[rmk_central] macro.

[keyboard]
name = "Halcyon Kyria"
product_name = "Halcyon Kyria"
vendor_id = 0x4c4b
product_id = 0x0002
manufacturer = "splitkb"
chip = "rp2040"

# Split transport: full-duplex UART over USB-C cable
# The USB-C cable between halves carries UART signals (not USB protocol).
# TX=PIN_28 (GP28), RX=PIN_29 (GP29) on the Halcyon controller.
# Source: https://docs.splitkb.com/product-guides/halcyon-series/schematics/controller-specification

[split]
connection = "serial"

[split.central]
rows = 4
cols = 7
row_offset = 0
col_offset = 0
serial = [{ instance = "UART0", tx_pin = "PIN_28", rx_pin = "PIN_29" }]

[split.central.matrix]
matrix_type = "normal"
# Rows: IO_01=GP8, IO_02=GP11, IO_03=GP7, IO_04=GP6
row_pins = ["PIN_8", "PIN_11", "PIN_7", "PIN_6"]
# Left half cols COL0→COL6 (outer to inner), derived empirically from a key tester:
# IO_05=GP5, IO_06=GP10, IO_07=GP9, IO_08=GP4, IO_09=GP25, IO_10=GP20, IO_11=GP19
col_pins = ["PIN_5", "PIN_10", "PIN_9", "PIN_4", "PIN_25", "PIN_20", "PIN_19"]
bootmagic = [0, 0]

[[split.peripheral]]
rows = 4
cols = 7
row_offset = 0
col_offset = 7
serial = [{ instance = "UART0", tx_pin = "PIN_28", rx_pin = "PIN_29" }]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["PIN_8", "PIN_11", "PIN_7", "PIN_6"]
# Right half uses the SAME column order as the left, not a mirrored one.
# The "same PCB rotated 180 degrees" assumption that previously reversed this
# list was wrong; verified on hardware with a key tester.
# COL0→COL6 (outer to inner, same as central):
# IO_05=GP5, IO_06=GP10, IO_07=GP9, IO_08=GP4, IO_09=GP25, IO_10=GP20, IO_11=GP19
col_pins = ["PIN_5", "PIN_10", "PIN_9", "PIN_4", "PIN_25", "PIN_20", "PIN_19"]
bootmagic = [0, 0]

# Encoders
# IO_13=GP23 (A), IO_14=GP22 (B) on both halves.

[storage]
