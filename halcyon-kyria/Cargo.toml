[package]
name = "halcyon-kyria"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "halcyon-kyria-central"
path = "src/central.rs"

[[bin]]
name = "halcyon-kyria-peripheral"
path = "src/peripheral.rs"

[dependencies]
rmk = { version = "0.9", default-features = false, features = ["defmt", "host_lock", "watchdog", "split", "rp2040"] }
embassy-rp = { version = "0.10", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5"
embassy-futures = "0.1"
cortex-m-rt = "0.7"
cortex-m = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

